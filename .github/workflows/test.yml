# Mother CI: the full suite (Go broker + bats) on every PR and every push to main.
#
#   go         broker gofmt / vet (native + GOOS=darwin) / build / go test         (ubuntu)
#   shard-plan coverage guard: every tests/*.bats file is in exactly one shard      (ubuntu)
#   bats       the bats suite, SHARDS shards in parallel                            (macos-15)
#   ci-ok      the ONE required check: green only if all of the above are green     (ubuntu)
#
# Design notes (see CLAUDE.md "Tests"):
# - Shards run on macOS because the suite is macOS-first (BSD tools, launchd, osascript shims).
#   macOS runners are capped at 5 concurrent jobs on Free/Pro/Team, so SHARDS=5 is the fastest
#   configuration there (6-8 shards would run in two waves). Raise it only if the account's macOS
#   concurrency is higher or the shards move to Linux (`workflow_dispatch` runner=ubuntu-latest probes that).
# - The Go job runs on ubuntu: the broker tests have no darwin-specific code (peer_darwin.go is the only
#   darwin file, no _test.go references GOOS). `GOOS=darwin go vet` catches darwin-only compile errors, and
#   every macOS shard builds the broker natively. If a Go test turns out to be darwin-only, move `go` to macos-15.
# - Caching: setup-go caches the module + build cache (keyed on go.sum); setup-python caches pip. The broker
#   BINARY is deliberately not cached: with a warm GOCACHE `go build` relinks in seconds, and always
#   rebuilding removes the stale-binary failure class (broker.bats only builds when the binary is missing).
# - No paths/paths-ignore filters: a required check must always report.
# - The live state tree must never be touched: MOTHER_ROOT points at a path that must not exist and
#   MOTHER_LIVE_ROOT is never set; each shard asserts ~/.mother and the guard path stay absent.
name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner for the bats shards (macos-15, or ubuntu-latest to probe a Linux run; not required)"
        default: macos-15
        type: string

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# BATS_TEST_TIMEOUT is deliberately NOT set: bats implements it with a background countdown process that
# a bare `wait` in a test (preview.bats, others) then waits for, so those tests hang to the ceiling and fail;
# it also makes a nested `bats` hang (ci_shards.bats). Hangs are bounded by timeout-minutes instead.
env:
  SHARDS: 5
  MOTHER_ROOT: /nonexistent-guard
  MOTHER_TEST_STRICT_SKIPS: "1"
  MOTHER_TEST_LANES: "1"
  GIT_AUTHOR_NAME: mother-ci
  GIT_AUTHOR_EMAIL: ci@invalid
  GIT_COMMITTER_NAME: mother-ci
  GIT_COMMITTER_EMAIL: ci@invalid

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # setup-go can't parse `.tool-versions` ("golang 1.26.0"): read the version ourselves.
      - name: Go version from .tool-versions
        id: gover
        run: echo "version=$(awk '$1 == "golang" { print $2 }' plugins/mother/broker/.tool-versions)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.gover.outputs.version }}
          cache-dependency-path: plugins/mother/broker/go.sum
      - name: Broker checks (gofmt, vet, build, test)
        run: ./plugins/mother/scripts/run-tests.sh --go-only

  shard-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - name: Coverage guard and matrix
        id: plan
        run: |
          matrix="$(./plugins/mother/scripts/test-shards.sh check "$SHARDS")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"

  bats:
    name: bats (${{ matrix.shard }}/${{ needs.shard-plan.outputs.shards }})
    needs: shard-plan
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shard-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Shard output dir
        run: echo "MOTHER_TEST_OUT=$RUNNER_TEMP/bats-out" >> "$GITHUB_ENV"
      # The runner's `bash` is /bin/bash 3.2.57; the suite (and the dev machine, where Homebrew's bash
      # leads PATH) runs on bash 5, and several tests fail under 3.2 (nested quotes in $(...), etc.).
      # fzf is needed by progress_flags.bats (otherwise a strict-mode skip).
      - name: Homebrew bash and fzf
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install bash fzf
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      # setup-go can't parse `.tool-versions` ("golang 1.26.0"): read the version ourselves.
      - name: Go version from .tool-versions
        id: gover
        run: echo "version=$(awk '$1 == "golang" { print $2 }' plugins/mother/broker/.tool-versions)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.gover.outputs.version }}
          cache-dependency-path: plugins/mother/broker/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: plugins/mother/requirements-ci.txt
      - name: Install PyYAML
        run: pip install -r plugins/mother/requirements-ci.txt
      - name: Install bats-core
        run: |
          git clone --depth 1 --branch v1.13.0 https://github.com/bats-core/bats-core "$RUNNER_TEMP/bats"
          "$RUNNER_TEMP/bats/install.sh" "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Git defaults
        run: git config --global init.defaultBranch main
      - name: Tool versions
        run: |
          bash --version | head -1
          bash -c '[ "${BASH_VERSINFO[0]}" -ge 5 ]' || { echo "::error::bash on PATH is not 5.x"; exit 1; }
          fzf --version
          bats --version
          jq --version
          python3 --version
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'
          go version
          git --version
      - name: Guard (before)
        run: |
          if [ -e "$HOME/.mother" ]; then echo "::error::$HOME/.mother exists before the run"; exit 1; fi
      - name: Run shard
        env:
          SHARD: ${{ matrix.shard }}
        run: ./plugins/mother/scripts/run-tests.sh --shard "$SHARD/$SHARDS"
      - name: Guard (after)
        if: always()
        run: |
          rc=0
          if [ -e "$HOME/.mother" ]; then echo "::error::the run created $HOME/.mother"; rc=1; fi
          if [ -e /nonexistent-guard ]; then echo "::error::the run created /nonexistent-guard (MOTHER_ROOT leaked into a code path)"; rc=1; fi
          exit "$rc"
      - name: Upload shard output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bats-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/bats-out
          if-no-files-found: warn
      - name: Upload shard timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bats-timings-${{ matrix.shard }}
          path: ${{ runner.temp }}/bats-out/timings.tsv
          if-no-files-found: warn

  ci-ok:
    name: ci-ok
    needs: [go, shard-plan, bats]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' > results.md
          { echo "| job | result |"; echo "|---|---|"; cat results.md; } >> "$GITHUB_STEP_SUMMARY"
          bad="$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"')"
          if [ -n "$bad" ]; then
            echo "::error::not green: $bad"
            exit 1
          fi
